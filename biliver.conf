# Biliver 弹幕配置
# 将此文件放在 MPV 的 script-opts/ 目录下
# 例如: ~/.config/mpv/script-opts/biliver.conf (Linux/macOS)
#       %APPDATA%/mpv/script-opts/biliver.conf (Windows)

# 弹幕字体名称
# 注意：如果 libass 找不到指定字体会反复打印错误日志，导致严重性能开销
# 若遇到此问题（控制台频繁出现字体相关错误），可尝试以下方案：
#   1. 改用系统安全字体，如：Arial, sans-serif, Segoe UI
#   2. 确认系统中已安装 Microsoft YaHei（微软雅黑）字体
#   3. 在 mpv.conf 中添加 sub-fonts-dir="C:\\Windows\\Fonts"
fontname=Microsoft YaHei

# 弹幕字体大小 (像素)
font_size=36

# 弹幕飞行时间 (秒)，数值越小速度越快
duration=13

# 弹幕不透明度 (0-100)，100 为完全不透明
opacity=60

# 弹幕占用屏幕高度比例 (0.0-1.0)
area=0.45

# 是否开启 60fps 弹幕平滑补帧 (yes/no)
fps_vf=yes

# Python 解释器路径 (默认使用系统 PATH 中的 python)
python_path=python

# 直播弹幕池大小上限 (默认 1000)
# 弹幕池由渲染循环按显示时长自动清理，此上限仅在极端弹幕潮时兜底
# 超出上限时丢弃最旧条目；Ctrl+D 隐藏弹幕时自动清空
max_pool=1000
